<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/><stop offset="1" stop-color="#D3D8DE"/>
    </linearGradient>
    <radialGradient id="v1" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.16"/>
    </radialGradient>
    <pattern id="m1" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#2B3A4A" stroke-width="1.6" opacity="0.34"/>
      <line x1="9" y1="0" x2="9" y2="18" stroke="#2B3A4A" stroke-width="0.6" opacity="0.22"/>
